<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    h1 {
      color: white;
      font-size: 3rem;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .game-wrapper {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }

    #gameCanvas {
      background: #1a1a2e;
      border: 3px solid white;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .info {
      color: white;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .score-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
      min-width: 150px;
    }

    .score-label {
      font-size: 0.875rem;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .score-value {
      font-size: 2.5rem;
      font-weight: 700;
    }

    .controls {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 1.5rem;
      font-size: 0.9rem;
      line-height: 1.6;
      opacity: 0.9;
    }

    .controls strong {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }

    .button-group {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .game-wrapper {
        flex-direction: column;
        align-items: center;
      }

      h1 {
        font-size: 2rem;
      }

      #gameCanvas {
        width: 100%;
        max-width: 300px;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐍 Snake</h1>
    <div class="game-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div class="info">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-value" id="score">0</div>
        </div>
        <div class="controls">
          <strong>Controls</strong>
          ↑↓←→ or WASD<br>
          SPACE to pause
        </div>
        <div class="button-group">
          <button id="startButton">Start Game</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score');
    const startButton = document.getElementById('startButton');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 15 };
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let score = 0;
    let gameRunning = false;
    let gamePaused = false;
    let gameOver = false;

    function generateFood() {
      let newFood;
      let valid = false;
      while (!valid) {
        newFood = {
          x: Math.floor(Math.random() * TILE_COUNT),
          y: Math.floor(Math.random() * TILE_COUNT)
        };
        valid = !snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
      }
      return newFood;
    }

    function update() {
      if (!gameRunning || gamePaused || gameOver) return;

      direction = nextDirection;

      const head = snake[0];
      const newHead = {
        x: (head.x + direction.x + TILE_COUNT) % TILE_COUNT,
        y: (head.y + direction.y + TILE_COUNT) % TILE_COUNT
      };

      // Check collision with self
      if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
        endGame();
        return;
      }

      snake.unshift(newHead);

      // Check food collision
      if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;
        scoreDisplay.textContent = score;
        food = generateFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Clear canvas
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= TILE_COUNT; i++) {
        const pos = i * GRID_SIZE;
        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(canvas.width, pos);
        ctx.stroke();
      }

      // Draw food
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(
        food.x * GRID_SIZE + GRID_SIZE / 2,
        food.y * GRID_SIZE + GRID_SIZE / 2,
        GRID_SIZE / 2 - 1,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Draw snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          // Head
          ctx.fillStyle = '#4ecdc4';
        } else {
          // Body
          ctx.fillStyle = '#45b7aa';
        }
        ctx.fillRect(
          segment.x * GRID_SIZE + 1,
          segment.y * GRID_SIZE + 1,
          GRID_SIZE - 2,
          GRID_SIZE - 2
        );
      });

      // Draw pause text
      if (gamePaused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 30px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
      }

      // Draw game over
      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.font = 'bold 40px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);
        ctx.font = '24px sans-serif';
        ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      snake = [{ x: 10, y: 10 }];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      scoreDisplay.textContent = score;
      gameRunning = true;
      gamePaused = false;
      gameOver = false;
      food = generateFood();
      startButton.textContent = 'Restart Game';
    }

    function endGame() {
      gameRunning = false;
      gameOver = true;
    }

    function togglePause() {
      if (gameRunning && !gameOver) {
        gamePaused = !gamePaused;
      }
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === ' ') {
        e.preventDefault();
        togglePause();
        return;
      }

      if (!gameRunning && !gameOver) return;

      const keyMap = {
        'arrowup': { x: 0, y: -1 },
        'arrowdown': { x: 0, y: 1 },
        'arrowleft': { x: -1, y: 0 },
        'arrowright': { x: 1, y: 0 },
        'w': { x: 0, y: -1 },
        's': { x: 0, y: 1 },
        'a': { x: -1, y: 0 },
        'd': { x: 1, y: 0 }
      };

      if (keyMap[key]) {
        e.preventDefault();
        const newDir = keyMap[key];
        // Prevent reversing into itself
        if (!(direction.x === -newDir.x && direction.y === -newDir.y)) {
          nextDirection = newDir;
        }
      }
    });

    startButton.addEventListener('click', startGame);

    // Start game loop
    gameLoop();
  </script>
</body>
</html>
